<!DOCTYPE html>
<html>
<head>
<title>FAMO OMNISPHERE WEATHER MATRIX</title>
<script></script>
<style>
body { background-color: #000000; color: #ff6600; font-family: monospace; text-align: center; margin: 0; padding: 20px; }
    /* ... CSS styles for layout ... */
   .globe-viewport-container { display: none !important; }
        body { background-color: #000000; color: #ff6600; font-family: monospace; text-align: center; margin: 0; padding: 20px; }
    .globe-viewport-container { display: none !important; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; padding: 10px; }
    .card { background: #120c1f; border: 2px solid #7c4dff; border-radius: 8px; padding: 20px; box-shadow: 0 0 15px rgba(124,77,255,0.3); text-align: left; transition: transform 0.3s ease; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 0 25px rgba(124,77,255,0.6); }
    .city-name { font-size: 1.4rem; margin: 0 0 10px 0; color: #00ffff; border-bottom: 1px solid #7c4dff; padding-bottom: 5px; }
    .temp { font-size: 2.2rem; font-weight: bold; margin: 10px 0; color: #ff6600; }
    .wind { font-size: 1rem; color: #a0a0a0; }
    .timestamp { font-size: 1.1rem; margin-top: 30px; color: #7c4dff; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="alert-banner">Sovereign Grid Protocol: Advanced Environmental Streams Active</div>
<h1>FAMO NATION WEATHER CHANNELS MATRIX</h1>
<div class="globe-viewport-container"><canvas id="aiStormGlobe"></canvas></div>
<div class="grid" id="weather-grid"></div>
<div class="timestamp" id="matrix-timestamp">Syncing Server Clock...</div>

<script>
// Completely kill the 3D globe engine crashes
window.THREE = {
  Scene: function() { this.add = function(){}; },
  PerspectiveCamera: function() { this.position = {z:0}; },
  WebGLRenderer: function() { this.setSize = function(){}; this.render = function(){}; this.domElement = document.createElement('div'); },
  AmbientLight: function() {},
  DirectionalLight: function() {},
  SphereGeometry: function() {},
  MeshBasicMaterial: function() {},
  Mesh: function() { this.position = {x:0,y:0,z:0}; this.rotation = {x:0,y:0,z:0}; }
};

// Now start the weather setup safely
const canvas = document.getElementById('aiStormGlobe');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
renderer.setSize(canvas.parentNode.clientWidth, canvas.parentNode.clientHeight);
  const globeGeometry = new THREE.SphereGeometry(2, 32, 32);
const globeMaterial = new THREE.MeshBasicMaterial({ color: "#7c4dff", wireframe: true });
const globe = new THREE.Mesh(globeGeometry, globeMaterial);
scene.add(globe);
camera.position.z = 5;

function animateGlobe() {
    requestAnimationFrame(animateGlobe);
    globe.rotation.y += 0.003;
    renderer.render(scene, camera);
}
animateGlobe();
    const locations = [
    { name: "Muskogee, OK", lat: 35.7479, lon: -95.3697 },
    { name: "Rapid City, SD", lat: 44.0805, lon: -103.2310 },
    { name: "Kansas City, MO", lat: 39.0997, lon: -94.5786 },
    { name: "Independence, KS", lat: 37.2242, lon: -95.7083 },
    { name: "Philadelphia, PA", lat: 39.9526, lon: -75.1652 }
];
async function fetchWeather() {
    const grid = document.getElementById('weather-grid');
    grid.innerHTML = '';

    for (let loc of cities) {
        try {
            const url = `https://open-meteo.com{loc.lat}&longitude=${loc.lon}&current_weather=true`;
            const response = await fetch(url);
            const data = await response.json();
            const current = data.current_weather;
            
            if (current) {
                const tempC = current.temperature;
                const tempF = ((tempC * 9) / 5 + 32).toFixed(1);
                const wind = current.windspeed;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3 class="city-name">${loc.name}</h3>
                    <p class="temp">${tempF}°F <span style="font-size:1.1rem; color:#888;">(${tempC}°C)</span></p>
                    <p class="wind">💨 Wind Vector: ${wind} km/h</p>
                `;
                grid.appendChild(card);
            }
        } catch (error) {
            console.log("Matrix node ingestion offline or holding connection...");
        }
    }
}

    document.getElementById('matrix-timestamp').innerText = `SYSTEM GRID ACTIVE // TIME SYNC: ${new Date().toLocaleTimeString()}`;
}
fetchWeather();
setInterval(fetchWeather, 900000);
</script>
</body>
</html>
