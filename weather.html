<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMO OMNISPHERE WEATHER MATRIX</title>
    <style>
        body { background-color: #000000; color: #ff6600; font-family: monospace; text-align: center; margin: 0; padding: 20px; }
        .terminal-container { max-width: 950px; margin: 40px auto; border: 2px solid #7c4dff; border-radius: 8px; background: #030108; padding: 30px; box-shadow: 0 0 25px rgba(124,77,255,0.4); }
        h1 { color: #00ffff; font-size: 1.8rem; letter-spacing: 2px; margin-bottom: 5px; }
        .subtitle { color: #7c4dff; font-size: 0.9rem; margin-bottom: 25px; text-transform: uppercase; }
        
        /* Multi-City Display Rows */
        .city-row { display: grid; grid-template-columns: 220px repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; background: #120c1f; border: 1px solid #7c4dff; border-radius: 6px; padding: 15px; margin-bottom: 15px; text-align: left; box-shadow: inset 0 0 10px rgba(124,77,255,0.1); transition: all 0.3s ease; }
        .city-row:hover { border-color: #39ff14; box-shadow: 0 0 10px rgba(57,255,20,0.2); }
        
        .city-name { color: #00ffff; font-size: 1.1rem; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; }
        .data-block { display: flex; flex-direction: column; }
        .label { color: #7c4dff; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .value { color: #39ff14; font-size: 1.4rem; font-weight: bold; text-shadow: 0 0 8px rgba(57,255,20,0.4); }
        .condition-text { color: #cccccc; font-size: 0.85rem; text-transform: uppercase; }

        /* The Live Ticker Readout Panel */
        .marquee-box { background: #120c1f; border: 2px solid #ff6600; padding: 12px; overflow: hidden; white-space: nowrap; margin-bottom: 25px; }
        .marquee-text { display: inline-block; padding-left: 100%; font-size: 1.2rem; font-weight: bold; color: #ff6600; animation: rollText 35s linear infinite; }
        
        @keyframes rollText {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        
        .footer-log { margin-top: 30px; font-size: 0.8rem; color: #555; border-top: 1px dashed #222; padding-top: 15px; }
    </style>
</head>
<body>

<div class="terminal-container">
    <h1>[SOVEREIGN GLOBAL WEATHER MATRIX]</h1>
    <div class="subtitle">Multi-Sector Atmospheric Ledgers // REGISTRY ACTIVE</div>

    <!-- Live Unified Status Banner Ticker -->
    <div class="marquee-box">
        <div class="marquee-text" id="system-ticker">SYSTEM PIPELINE ARMED // LOADING SECTOR LEDGERS MATRIX...</div>
    </div>

    <!-- Active Multi-City Datastream Injection Point -->
    <div id="matrix-display-core">
        <!-- City Data Rows will auto-inject right here dynamically via JavaScript -->
    </div>

    <div class="footer-log">
        SECURE GLOBAL WEATHER DATA HUB // SERVER SYNC TIME: <span id="clock-display">CONNECTING...</span>
    </div>
</div>

<script>
    // System Target Sectors Definition Registry Map Array
    const trackingSectors = [
        { name: "Muskogee, OK", lat: 35.7479, lon: -95.3697 },
        { name: "Rapid City, SD", lat: 44.0805, lon: -103.2310 },
        { name: "Independence, KS", lat: 37.2242, lon: -95.7083 },
        { name: "Philadelphia, PA", lat: 39.9526, lon: -75.1652 },
        { name: "Kansas City, MO", lat: 39.0997, lon: -94.5786 },
        { name: "Wichita, KS", lat: 37.6872, lon: -97.3301 },
        { name: "Tehran, Iran", lat: 35.6892, lon: 51.3890 }
    ];

    async function fetchAllSectorWeather() {
        let tickerSummary = "ACTIVE REGIONAL EMISSION LOG: ";
        const displayCore = document.getElementById('matrix-display-core');
        displayCore.innerHTML = ""; // Clear loader canvas

        // Loop through every single tracking sector city item dynamically
        for (const sector of trackingSectors) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${sector.lat}&longitude=${sector.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data || !data.current) continue;
                const current = data.current;

                // Interpret atmospheric metadata codes
                let codeDesc = "CLEAR VECTOR";
                if (current.weather_code > 0) codeDesc = "PARTLY CLOUDY";
                if (current.weather_code >= 45) codeDesc = "FOG ATMOSPHERE";
                if (current.weather_code >= 51) codeDesc = "ACTIVE RAIN CORE";
                if (current.weather_code >= 71) codeDesc = "SNOW INJECTION";
                if (current.weather_code >= 95) codeDesc = "THUNDER STORM CORE";

                // Generate and inject a premium data card row container
                const rowHTML = `
                    <div class="city-row">
                        <div class="city-name">▶ ${sector.name}</div>
                        <div class="data-block">
                            <span class="label">Core Temp</span>
                            <span class="value">${Math.round(current.temperature_2m)}°F</span>
                        </div>
                        <div class="data-block">
                            <span class="label">Wind Vector</span>
                            <span class="value">${Math.round(current.wind_speed_10m)} MPH</span>
                        </div>
                        <div class="data-block">
                            <span class="label">Moisture Matrix</span>
                            <span class="value">${current.relative_humidity_2m}% RH</span>
                        </div>
                        <div class="data-block">
                            <span class="label">Status Log</span>
                            <span class="condition-text">${codeDesc}</span>
                        </div>
                    </div>
                `;
                displayCore.innerHTML += rowHTML;

                // Build summary text string variable parameters for the top rolling text marquee
                tickerSummary += `[${sector.name.toUpperCase()}: ${Math.round(current.temperature_2m)}°F // ${codeDesc}] — `;

            } catch (err) {
                console.log(`Error ingestion on sector ${sector.name}`);
            }
        }

        // Output final compiled data streams right into the sliding top marquee text field
        document.getElementById('system-ticker').innerText = tickerSummary + "ALL GLOBAL CHANNELS OPERATIONAL //";
    }

    function updateServerClock() {
        const now = new Date();
        document.getElementById('clock-display').innerText = now.toLocaleTimeString() + " // " + now.toLocaleDateString();
    }

    // Initialize systems
    fetchAllSectorWeather();
    updateServerClock();

    // Routine automatic pipeline refreshes
    setInterval(fetchAllSectorWeather, 300000); // Fetch new global city streams every 5 minutes
    setInterval(updateServerClock, 1000);       // Ticking clock interface update loop
</script>

</body>
</html>
