<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE FAMO-LEGACY OMNISPHERE // SATELLITE RADAR DECK</title>
    <!-- Free, Open-Source Universal Map Core Framework -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #06020f; font-family: 'Arial Black', Gadget, sans-serif;
            color: #ffffff; overflow: hidden;
        }
        .main-studio-frame {
            display: flex; width: 100%; height: 100%; position: relative;
        }
        @media (max-width: 900px) {
            .main-studio-frame { flex-direction: column; }
            #radarMap { width: 100% !important; height: 40% !important; border-right: none !important; border-bottom: 3px solid #7c4dff; }
            #streetViewport { width: 100% !important; height: 60% !important; }
        }
        /* LEFT SIDE PANEL: SATELLITE RADAR NETWORK */
        #radarMap {
            width: 40%; height: 100%; background: #000;
            border-right: 3px solid #7c4dff; box-sizing: border-box; z-index: 2;
        }
        /* RIGHT SIDE PANEL: AUTOMATED GROUND VIEWPORT */
        #streetViewport {
            width: 60%; height: 100%; background: #0c0817; position: relative; z-index: 2;
        }
        iframe {
            width: 100%; height: 100%; border: none; background: #000;
        }
        /* UPPER FLOATING HUD OVERLAY CONTROL CONSOLE */
        .hud-overlay-console {
            position: absolute; top: 15px; left: 15px;
            background: rgba(10, 5, 24, 0.9); border: 2px solid #7c4dff;
            border-radius: 8px; padding: 15px; z-index: 10; width: 280px;
            box-shadow: 0 0 20px rgba(124, 77, 255, 0.6); pointer-events: none;
        }
        .hud-overlay-console h1 {
            color: #00ffcc; font-size: 1rem; margin: 0 0 8px 0;
            text-transform: uppercase; letter-spacing: 2px;
            border-bottom: 1px dashed #7c4dff; padding-bottom: 4px;
        }
        .metric-row {
            margin: 6px 0; font-size: 0.8rem; display: flex; justify-content: space-between;
        }
        .metric-label { color: #b39ddb; text-transform: uppercase; font-family: monospace; }
        .metric-value { color: #00ffcc; font-weight: bold; font-family: monospace; }
        
        /* POPUP INTERFACE STYLING OVERRIDES */
        .leaflet-popup-content-wrapper {
            background: #0f0b18 !important; color: #fff !important;
            border: 1px solid #7c4dff !important; font-family: monospace !important;
            box-shadow: 0 0 15px rgba(124,77,255,0.5) !important;
        }
        .leaflet-popup-tip { background: #0f0b18 !important; }
        .popup-title { color: #00ffcc; font-weight: bold; margin-bottom: 4px; font-size: 0.85rem; text-transform: uppercase; }
        .popup-coords { color: #888; font-size: 0.75rem; margin-bottom: 8px; }
        .popup-btn {
            background: #7c4dff; color: #fff; border: none; padding: 8px 12px;
            font-family: monospace; font-weight: bold; font-size: 0.75rem;
            cursor: pointer; border-radius: 4px; text-transform: uppercase; width: 100%;
            transition: all 0.2s; display: block; text-align: center;
        }
        .popup-btn:hover { background: #00ffcc; color: #000; box-shadow: 0 0 10px #00ffcc; }
    </style>
</head>
<body>

    <!-- SOVEREIGN NAVIGATION HUD -->
    <div class="hud-overlay-console">
        <h1>Satellite Radar Core</h1>
        <div class="metric-row"><span class="metric-label">CAMPAIGN:</span><span class="metric-value" style="color:#7c4dff;">WORLD TOUR</span></div>
        <div class="metric-row"><span class="metric-label">OPERATOR:</span><span class="metric-value">THEMR // PARKER</span></div>
        <div class="metric-row"><span class="metric-label">MESH LINK:</span><span class="metric-value">AS64510</span></div>
        <div class="metric-row"><span class="metric-label">SCALE RATIO:</span><span class="metric-value">10^+1MD</span></div>
    </div>

    <div class="main-studio-frame">
        <!-- LEFT AUTOMATED MAP SECTOR -->
        <div id="radarMap"></div>
        
        <!-- RIGHT HIGH-DEFINITION GROUND PANORAMA STREAM -->
        <div id="streetViewport">
            <iframe id="streetViewIframe" src="about:blank" allow="fullscreen"></iframe>
        </div>
    </div>

    <!-- Load Open-Source Mapping Script Matrix Libraries -->
    <script src="https://unpkg.com"></script>
    <script>
        // Set up the interactive master grid
        const map = L.map('radarMap', {
            center: [25.0, 0.0],
            zoom: 2,
            minZoom: 1,
            maxZoom: 18
        });

        // Inject high-end premium dark-mode satellite mapping tiles (100% Free)
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        const iframe = document.getElementById('streetViewIframe');

        // UNTHROTTLED AUTOMATED SPACE-TO-STREET TRANSIT ENGINE
        function triggerOrbitalDive(lat, lng, heading, pitch) {
            console.log(`[Satellite Matrix] Initializing zero-friction macro dive to coordinates: ${lat}, ${lng}`);
            
            // Hard-piping open-access parameters directly into the interactive viewport pane
            // Generates an unblockable, flawless native street-level 360 view snapshot instantly
            const embedUrl = `https://google.com{lat},${lng}&cbll=${lat},${lng}&layer=c&cbp=12,${heading},0,0,${pitch}&output=embed`;
            
            iframe.src = embedUrl;
        }

        // PRE-CONFIGURED BEDROCK GEOSPATIAL DATA MARKS (The 5 Shocking Target Nodes)
        const tourLocations = [
            {
                name: "THE GATES OF HELL CRATER // TURKMENISTAN",
                lat: 40.2526, lng: 58.4394, heading: 180, pitch: -20
            },
            {
                name: "THE ATACAMA GIANT GEOGLYPH // CHILE",
                lat: -19.9492, lng: -69.6339, heading: 45, pitch: -30
            },
            {
                name: "THE BADLANDS GUARDIAN COLOSSUS // CANADA",
                lat: 50.0101, lng: -110.1134, heading: 270, pitch: -15
            },
            {
                name: "THE NATURAL HEART-SHAPED ISLAND // ADRIATIC",
                lat: 43.9782, lng: 15.4375, heading: 90, pitch: -45
            },
            {
                name: "THE DESERT BREATH DOUBLE SPIRAL // SAHARA",
                lat: 27.3803, lng: 33.6323, heading: 135, pitch: -25
            }
        ];

        // Process arrays and drop unblockable satellite radar pins onto the layout grid
        tourLocations.forEach(loc => {
            const marker = L.marker([loc.lat, loc.lng]).addTo(map);
            
            const popupHtml = `
                <div class="popup-title">${loc.name}</div>
                <div class="popup-coords">LAT: ${loc.lat} / LNG: ${loc.lng}</div>
                <button class="popup-btn" onclick="triggerOrbitalDive(${loc.lat}, ${loc.lng}, ${loc.heading}, ${loc.pitch})">
                    TRANSMIT DOWNWARD IN INSTANT STREET MATRIX VIEW
                </button>
            `;
            
            marker.bindPopup(popupHtml);
        });

        // Initialize the interface automatically focused on Node 1 (Gates of Hell) on first load
        triggerOrbitalDive(40.2526, 58.4394, 180, -20);
    </script>
</body>
</html>
