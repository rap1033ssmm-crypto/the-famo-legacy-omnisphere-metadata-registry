<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE FAMO-LEGACY OMNISPHERE // SATELLITE RADAR DECK</title>
    <!-- Open-Source Map Framework Ingestion -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #06020f; font-family: monospace; color: #ffffff;
            overflow: hidden;
        }
        .main-studio-frame {
            display: flex; width: 100%; height: 100%; position: relative;
        }
        /* LEFT SIDE PANEL: SATELLITE RADAR CORE */
        #radarMap {
            width: 40%; height: 100%; background: #000;
            border-right: 3px solid #7c4dff; box-sizing: border-box; z-index: 2;
        }
        /* RIGHT SIDE PANEL: FRONT ROW GROUND-LEVEL VIEWPORT */
        #streetViewport {
            width: 60%; height: 100%; background: #0c0817; position: relative; z-index: 2;
        }
        iframe {
            width: 100%; height: 100%; border: none; background: #000;
        }
        /* UPPER FLOATING HUD OVERLAY CONTROL PANEL */
        .hud-overlay-console {
            position: absolute; top: 15px; left: 15px;
            background: rgba(10, 5, 24, 0.9); border: 2px solid #7c4dff;
            border-radius: 8px; padding: 15px; z-index: 10; width: 290px;
            box-shadow: 0 0 20px rgba(124, 77, 255, 0.6); pointer-events: auto;
        }
        .hud-overlay-console h1 {
            color: #00ffcc; font-size: 1rem; margin: 0 0 8px 0;
            text-transform: uppercase; letter-spacing: 2px;
            border-bottom: 1px dashed #7c4dff; padding-bottom: 4px;
        }
        .metric-row {
            margin: 6px 0; font-size: 0.8rem; display: flex; justify-content: space-between;
        }
        .metric-label { color: #b39ddb; text-transform: uppercase; }
        .metric-value { color: #00ffcc; font-weight: bold; }
        
        /* THE LEAFLET POPUP DESIGN MODIFICATIONS */
        .leaflet-popup-content-wrapper {
            background: #0f0b18 !important; color: #fff !important;
            border: 1px solid #7c4dff !important; font-family: monospace !important;
            box-shadow: 0 0 15px rgba(124,77,255,0.5) !important;
        }
        .leaflet-popup-tip { background: #0f0b18 !important; }
        .popup-title { color: #00ffcc; font-weight: bold; margin-bottom: 4px; font-size: 0.9rem; }
        .popup-coords { color: #888; font-size: 0.75rem; margin-bottom: 8px; }
        .popup-btn {
            background: #7c4dff; color: #fff; border: none; padding: 7px 12px;
            font-family: monospace; font-weight: bold; font-size: 0.75rem;
            cursor: pointer; border-radius: 4px; text-transform: uppercase; width: 100%;
            transition: all 0.2s;
        }
        .popup-btn:hover { background: #00ffcc; color: #000; }
    </style>
</head>
<body>

    <div class="hud-overlay-console">
        <h1>Satellite Tracker Core</h1>
        <div class="metric-row">
            <span class="metric-label">CAMPAIGN:</span>
            <span class="metric-value" style="color:#7c4dff;">WORLD TOUR</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">OPERATOR:</span>
            <span class="metric-value">THEMR // PARKER</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">REGISTRY ID:</span>
            <span class="metric-value">AS64510</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">SECTOR SCALE:</span>
            <span class="metric-value">10^+1MD</span>
        </div>
    </div>

    <div class="main-studio-frame">
        <!-- LEFT RADAR SCREEN SECTOR -->
        <div id="radarMap"></div>
        
        <!-- RIGHT HIGH-DENSITY GROUND VIEWPORT CONTAINER -->
        <div id="streetViewport">
            <iframe id="streetViewIframe" src="about:blank"></iframe>
        </div>
    </div>

      <!-- Open-Source Map Engine Library Scripts -->
    <script src="https://unpkg.com"></script>
    <script>
        // Initialize the Open-Source Radar Map Core
        const map = L.map('radarMap', {
            center: [20.0, 0.0],
            zoom: 2,
            minZoom: 1,
            maxZoom: 18
        });

        // Load premium dark-theme satellite layout grids (100% Free, No Token Required)
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        const iframe = document.getElementById('streetViewIframe');

        // Dynamic Space-to-Street Hyper-Velocity Jumper Logic Generator
        function transmitToStreetLevel(lat, lng, name) {
            console.log(`[Satellite Matrix] Commencing orbital dive to: ${name}`);
            
            // Hard-piping open-access parameters natively into the interactive viewing pane
            const embedUrl = `https://google.com{lat},${lng}&cbll=${lat},${lng}&layer=c&cbp=12,0,0,0,0&output=embed`;
            
            iframe.src = embedUrl;
        }

        // HARDCODED BEDROCK INFRASTRUCTURE DATA MARKS (The 5 Shocking Launch Nodes)
        const tourLocations = [
            {
                name: "THE GATES OF HELL CRATER // TURKMENISTAN",
                lat: 40.2526,
                lng: 58.4394
            },
            {
                name: "THE ATACAMA GIANT GEOGLYPH // CHILE",
                lat: -19.9492,
                lng: -69.6339
            },
            {
                name: "THE BADLANDS GUARDIAN COLOSSUS // CANADA",
                lat: 50.0101,
                lng: -110.1134
            },
            {
                name: "THE NATURAL HEART-SHAPED ISLAND // ADRIATIC",
                lat: 43.9782,
                lng: 15.4375
            },
            {
                name: "THE DESERT BREATH DOUBLE SPIRAL // SAHARA",
                lat: 27.3803,
                lng: 33.6323
            }
        ];

        // Process data marks and drop unblockable satellite pins onto the layout
        tourLocations.forEach(loc => {
            const marker = L.marker([loc.lat, loc.lng]).addTo(map);
            
            // Format custom HTML inside the layout popup grids
            const popupHtml = `
                <div class="popup-title">${loc.name}</div>
                <div class="popup-coords">LAT: ${loc.lat} / LNG: ${loc.lng}</div>
                <button class="popup-btn" onclick="transmitToStreetLevel(${loc.lat}, ${loc.lng}, '${loc.name}')">
                    TRANSMIT DOWNWARD IN INSTANT STREET MATRIX VIEW
                </button>
            `;
            
            marker.bindPopup(popupHtml);
        });

        // Auto-load the first operational node on deployment initialization
        transmitToStreetLevel(40.2526, 58.4394, "THE GATES OF HELL CRATER");
    </script>
</body>
</html>
