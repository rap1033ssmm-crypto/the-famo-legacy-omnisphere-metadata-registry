<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE QUANTUM PULSE SESSION 24-7 RADIO STATION</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --cyber-dark: #070a0e;
            --panel-bg: #0f141c;
            --text-main: #f1f5f9;
            --text-dim: #64748b;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--cyber-dark); color: var(--text-main); overflow-x: hidden; padding: clamp(10px, 2vw, 30px); }
        .matrix-container { max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: clamp(10px, 2vw, 25px); }
        @media (max-width: 1024px) { .matrix-container { grid-template-columns: 1fr; } }
        .deck-panel { background: var(--panel-bg); border: 2px solid #1e293b; border-radius: 12px; padding: clamp(15px, 3vw, 30px); position: relative; }
        .deck-panel::before { content: "AUTOMOTIVE ECOSYSTEM PROFILE"; position: absolute; top: -10px; right: 20px; background: var(--cyber-dark); color: var(--neon-green); font-size: 0.7rem; padding: 2px 10px; border: 1px solid var(--neon-green); border-radius: 4px; }
        h1, h2 { color: #fff; letter-spacing: 2px; margin-bottom: 20px; border-bottom: 1px dashed #1e293b; padding-bottom: 10px; }
        h1 { font-size: clamp(1.2rem, 2.5vw, 1.6rem); text-transform: uppercase; }
        h2 { font-size: 1rem; color: var(--neon-green); text-transform: uppercase; }
        .ticker-wrapper { background: #000; border: 2px solid var(--neon-green); padding: 15px; border-radius: 6px; overflow: hidden; white-space: nowrap; margin-bottom: 25px; }
        .ticker-text { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; color: var(--neon-green); font-weight: bold; }
        @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .player-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin: 20px 0; background: #090d10; padding: 20px; border-radius: 8px; }
        .btn { background: transparent; border: 2px solid var(--neon-green); color: var(--neon-green); padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: all 0.2s ease; width: 100%; }
        .btn:hover { background: var(--neon-green); color: var(--cyber-dark); }
        .btn-stop { border-color: var(--accent-red); color: var(--accent-red); }
        .btn-stop:hover { background: var(--accent-red); color: #fff; }
        .btn-purple { border-color: var(--accent-purple); color: var(--accent-purple); }
        .btn-purple:hover { background: var(--accent-purple); color: #000; }
        .form-control { width: 100%; background: #090d10; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
        .manifest-list { max-height: 220px; overflow-y: auto; border: 1px solid #1e293b; background: #090d10; padding: 10px; border-radius: 6px; }
        .analytics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .analytics-card { background: #090d10; border: 1px solid #1e293b; padding: 10px; border-radius: 6px; text-align: center; }
    </style>
</head>
<body>
    <div class="matrix-container">
        <div class="deck-panel">
            <h1>QUANTUM PULSE 24-7</h1>
            <div class="ticker-wrapper"><div class="ticker-text" id="metadataTicker">SYSTEM READY</div></div>
            <audio id="globalAudioPlayer" style="width: 100%;" controls></audio>
            <div class="player-controls">
                <button class="btn" onclick="engageTeamDJs()">Engage</button>
                <button class="btn btn-stop" onclick="killBroadcasting()">Kill</button>
            </div>
            <div class="vault-section">
                <h2>MANIFEST</h2>
                <div class="manifest-list" id="manifestDisplay"></div>
            </div>
        </div>
    </div>

    <script>
        let currentTrack = 1;
        let isFirstClick = true;
        const player = document.getElementById('globalAudioPlayer');
        const ticker = document.getElementById('metadataTicker');
        const repoBaseUrl = "https://githubusercontent.com";

        function engageTeamDJs() {
            if (isFirstClick) {
                player.src = repoBaseUrl + "famo_voice_drop1.mp3.aac.mp3";
                ticker.textContent = "NOW PLAYING: INTRO";
                isFirstClick = false;
            } else {
                player.src = repoBaseUrl + "track" + currentTrack + ".mp3.mp3";
                ticker.textContent = "NOW PLAYING: TRACK " + currentTrack;
                currentTrack = (currentTrack % 10) + 1;
            }
            player.play();
        }

        player.onended = () => engageTeamDJs();
        function killBroadcasting() { player.pause(); player.src = ""; }
    </script>
</body>
</html>
